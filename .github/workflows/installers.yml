name: Installers

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check tag matches Cargo.toml
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must look like v0.1.0, got: $tag"
            exit 1
          fi
          version="$(awk -F'"' '/^version[[:space:]]*=[[:space:]]*"/ { print $2; exit }' Cargo.toml)"
          if [[ "v$version" != "$tag" ]]; then
            echo "Cargo.toml version is $version but the tag is $tag"
            exit 1
          fi

  macos:
    name: macOS installers
    needs: validate
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build DMG and PKG
        shell: bash
        run: |
          chmod +x scripts/package.sh scripts/package-macos.sh scripts/package-linux.sh
          ./scripts/package-macos.sh --pkg
        env:
          CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: macos-installers
          path: |
            dist/macos/*.dmg
            dist/macos/*.pkg
          if-no-files-found: error

  windows:
    name: Windows installer
    needs: validate
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: powershell
        run: ./scripts/package-windows.ps1
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/windows/*.exe
          if-no-files-found: error

  linux:
    name: Linux packages
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install packaging tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev rpm file

      - name: Build DEB and RPM
        shell: bash
        run: |
          chmod +x scripts/package.sh scripts/package-linux.sh scripts/package-macos.sh
          ./scripts/package-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/linux/*.deb
            dist/linux/*.rpm
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS.tmp
          mv SHA256SUMS.tmp SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v3
        with:
          name: F-Terminal ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
