name: Installers

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  actions: read

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check tag matches Cargo.toml
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Tag must look like v0.1.0 or v0.1.0-alpha-001, got: $tag"
            exit 1
          fi
          base="${tag%%-*}"
          version="$(awk -F'"' '/^version[[:space:]]*=[[:space:]]*"/ { print $2; exit }' Cargo.toml)"
          if [[ "v$version" != "$base" ]]; then
            echo "Cargo.toml version is $version but the tag base is $base"
            exit 1
          fi

  macos:
    name: macOS installers
    needs: validate
    runs-on: macos-latest
    timeout-minutes: 45
    # macOS runners are billed separately and can be unavailable depending on
    # the repository plan. Keep publishing the other platforms in that case.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build DMG and PKG
        shell: bash
        run: |
          chmod +x scripts/package.sh scripts/package-macos.sh scripts/package-linux.sh
          ./scripts/package-macos.sh --pkg
        env:
          CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: macos-installers
          path: |
            dist/macos/*.dmg
            dist/macos/*.pkg
          if-no-files-found: error

  windows:
    name: Windows installer
    needs: validate
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          )
          if (-not ($candidates | Where-Object { $_ -and (Test-Path $_) })) {
            choco install innosetup --yes --no-progress
          }

      - name: Select Windows signing mode
        id: signing
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          REQUIRE_SIGNING: ${{ contains(github.ref_name, '-') && '0' || '1' }}
        run: |
          $mode = if ($env:SIGNPATH_API_TOKEN) {
            "signpath"
          } elseif ($env:WINDOWS_CERT_BASE64) {
            "pfx"
          } else {
            "none"
          }
          if ($mode -eq "signpath" -and (
              -not $env:SIGNPATH_ORGANIZATION_ID -or
              -not $env:SIGNPATH_PROJECT_SLUG -or
              -not $env:SIGNPATH_SIGNING_POLICY_SLUG
            )) {
            throw "SignPath is configured but SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG or SIGNPATH_SIGNING_POLICY_SLUG is missing."
          }
          if ($env:REQUIRE_SIGNING -eq "1" -and $mode -eq "none") {
            throw "Stable Windows installers must be signed. Configure SignPath or WINDOWS_CERT_BASE64."
          }
          "mode=$mode" >> $env:GITHUB_OUTPUT
          Write-Host "Windows signing mode: $mode"

      - name: Build unsigned app for SignPath
        if: steps.signing.outputs.mode == 'signpath'
        shell: powershell
        run: ./scripts/package-windows.ps1 -StageOnly -SkipSigning

      - name: Upload unsigned app
        id: upload-app
        if: steps.signing.outputs.mode == 'signpath'
        uses: actions/upload-artifact@v4
        with:
          name: windows-app-unsigned
          path: dist/windows/signpath/app/f-terminal.exe
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      - name: Sign app with SignPath
        if: steps.signing.outputs.mode == 'signpath'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: dist/windows/signpath/signed-app

      - name: Package installer with signed app
        if: steps.signing.outputs.mode == 'signpath'
        shell: powershell
        run: |
          $signed = Get-ChildItem -Path "dist/windows/signpath/signed-app" -Recurse -Filter "f-terminal.exe" -File |
            Select-Object -First 1
          if (-not $signed) {
            throw "SignPath did not return a signed f-terminal.exe."
          }
          ./scripts/package-windows.ps1 -SkipBuild -SkipSigning -UseBinary $signed.FullName

      - name: Upload unsigned installer
        id: upload-installer
        if: steps.signing.outputs.mode == 'signpath'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-unsigned
          path: dist/windows/F-Terminal-Setup-*.exe
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      - name: Sign installer with SignPath
        if: steps.signing.outputs.mode == 'signpath'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: dist/windows/signpath/signed-installer

      - name: Finalize SignPath artifacts
        if: steps.signing.outputs.mode == 'signpath'
        shell: pwsh
        run: |
          $app = Get-ChildItem -Path "dist/windows/signpath/signed-app" -Recurse -Filter "f-terminal.exe" -File |
            Select-Object -First 1
          if (-not $app) {
            throw "Signed app not found."
          }
          $setup = Get-ChildItem -Path "dist/windows/signpath/signed-installer" -Recurse -Filter "F-Terminal-Setup-*.exe" -File |
            Select-Object -First 1
          if (-not $setup) {
            throw "Signed installer not found."
          }
          foreach ($file in @($app.FullName, $setup.FullName)) {
            $signature = Get-AuthenticodeSignature -FilePath $file
            Write-Host "$file -> $($signature.Status) / $($signature.SignerCertificate.Subject)"
            if ($signature.Status -ne "Valid") {
              throw "Invalid Authenticode signature: $file"
            }
          }
          Copy-Item $setup.FullName (Join-Path "dist/windows" $setup.Name) -Force

      - name: Build installer with PFX or unsigned
        if: steps.signing.outputs.mode != 'signpath'
        shell: powershell
        run: ./scripts/package-windows.ps1
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
          REQUIRE_WINDOWS_SIGNING: ${{ steps.signing.outputs.mode == 'pfx' && '1' || '0' }}

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/windows/*.exe
          if-no-files-found: error
          overwrite: true

  linux:
    name: Linux packages
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install packaging tools
        shell: bash
        run: |
          if ! command -v dpkg-deb >/dev/null 2>&1 \
            || ! command -v rpm >/dev/null 2>&1 \
            || ! command -v file >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y dpkg-dev rpm file
          fi

      - name: Build DEB and RPM
        shell: bash
        run: |
          chmod +x scripts/package.sh scripts/package-linux.sh scripts/package-macos.sh
          ./scripts/package-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/linux/*.deb
            dist/linux/*.rpm
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [validate, macos, windows, linux]
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      (needs.macos.result == 'success' ||
       needs.windows.result == 'success' ||
       needs.linux.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Warn about failed platforms
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ needs.macos.result }}" != "success" ]]; then
            echo "::warning::macOS installers were not generated; publishing the remaining artifacts."
          fi
          if [[ "${{ needs.windows.result }}" != "success" ]]; then
            echo "::warning::Windows installer was not generated; publishing the remaining artifacts."
          fi
          if [[ "${{ needs.linux.result }}" != "success" ]]; then
            echo "::warning::Linux packages were not generated; publishing the remaining artifacts."
          fi

      - name: Remove stale test release
        if: contains(github.ref_name, '-test')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Removing existing release for $GITHUB_REF_NAME"
            gh release delete "$GITHUB_REF_NAME" --yes
          fi

      - name: Download macOS artifacts
        if: needs.macos.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: macos-installers
          path: dist

      - name: Download Windows artifacts
        if: needs.windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist

      - name: Download Linux artifacts
        if: needs.linux.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: dist

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS.tmp
          mv SHA256SUMS.tmp SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v3
        with:
          name: F-Terminal ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: dist/*
