[package]
name = "f-terminal"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Native GPU terminal with Git and code review"
repository = "https://github.com/fiopans1/F-Terminal"
license = "AGPL-3.0-only"
readme = "README.md"
keywords = ["terminal", "gpu", "wgpu", "git", "pty"]
categories = ["command-line-interface", "gui"]

[dependencies]
alacritty_terminal = "0.26"
anyhow = "1"
arboard = "3.6"
base64 = "0.22"
bytemuck = { version = "1", features = ["derive"] }
cosmic-text = "0.19"
env_logger = "0.11"
glyphon = "0.12"
log = "0.4"
pollster = "0.4"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
sysinfo = "0.40"
toml = "0.8"
vte = "0.15"
wgpu = "30"
winit = "0.30"

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21", default-features = false }

[profile.dev.package."*"]
opt-level = 1

[profile.release]
lto = "thin"
strip = true
